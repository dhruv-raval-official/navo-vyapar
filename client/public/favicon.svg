<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <defs>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fff2be"/>
      <stop offset="30%" stop-color="#d4af37"/>
      <stop offset="70%" stop-color="#a67c1e"/>
      <stop offset="100%" stop-color="#f7e8a4"/>
    </linearGradient>
    <linearGradient id="emeraldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#064e3b"/>
      <stop offset="50%" stop-color="#043a2c"/>
      <stop offset="100%" stop-color="#022c22"/>
    </linearGradient>
  </defs>

  <!-- Outer Rounded Shield -->
  <rect x="2" y="2" width="60" height="60" rx="14" fill="url(#emeraldGrad)" stroke="url(#goldGrad)" stroke-width="2.5"/>
  <rect x="5.5" y="5.5" width="53" height="53" rx="11" fill="none" stroke="#d4af37" stroke-width="0.75" stroke-opacity="0.4"/>

  <!-- Left Die (Gold) -->
  <g transform="translate(4, 9)">
    <rect x="6" y="6" width="23" height="23" rx="4.5" fill="url(#goldGrad)" stroke="#ffffff" stroke-width="0.8"/>
    <!-- 3 Pips -->
    <circle cx="11.5" cy="11.5" r="2" fill="#022c22"/>
    <circle cx="17.5" cy="17.5" r="2" fill="#022c22"/>
    <circle cx="23.5" cy="23.5" r="2" fill="#022c22"/>
  </g>

  <!-- Right Die (Ivory & Gold) -->
  <g transform="translate(25, 21)">
    <rect x="4" y="4" width="24" height="24" rx="4.5" fill="#fdfcf8" stroke="url(#goldGrad)" stroke-width="1.8"/>
    <!-- 5 Pips -->
    <circle cx="9.5" cy="9.5" r="1.9" fill="#a67c1e"/>
    <circle cx="22.5" cy="9.5" r="1.9" fill="#a67c1e"/>
    <circle cx="16" cy="16" r="2.2" fill="#d4af37"/>
    <circle cx="9.5" cy="22.5" r="1.9" fill="#a67c1e"/>
    <circle cx="22.5" cy="22.5" r="1.9" fill="#a67c1e"/>
  </g>
</svg>
